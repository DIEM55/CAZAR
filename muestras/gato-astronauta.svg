<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a2b5e"/>
      <stop offset="55%" stop-color="#14153a"/>
      <stop offset="100%" stop-color="#07071c"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6ebf5"/>
      <stop offset="100%" stop-color="#c3cce0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#7fb4e8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#2d6ea8" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffb37a"/>
      <stop offset="60%" stop-color="#e07a4f"/>
      <stop offset="100%" stop-color="#9c4530"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ad4ff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#8ad4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#space)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle cx="70" cy="90" r="2.2" opacity=".9"/><circle cx="150" cy="190" r="1.4" opacity=".6"/>
    <circle cx="240" cy="70" r="1.8" opacity=".75"/><circle cx="330" cy="150" r="1.2" opacity=".5"/>
    <circle cx="520" cy="60" r="2" opacity=".85"/><circle cx="640" cy="130" r="1.5" opacity=".65"/>
    <circle cx="720" cy="60" r="2.4" opacity=".95"/><circle cx="760" cy="250" r="1.3" opacity=".55"/>
    <circle cx="60" cy="330" r="1.6" opacity=".7"/><circle cx="110" cy="520" r="2.1" opacity=".8"/>
    <circle cx="48" cy="660" r="1.4" opacity=".6"/><circle cx="200" cy="730" r="1.9" opacity=".75"/>
    <circle cx="690" cy="470" r="1.5" opacity=".65"/><circle cx="745" cy="620" r="2.2" opacity=".85"/>
    <circle cx="600" cy="740" r="1.3" opacity=".5"/><circle cx="420" cy="770" r="1.7" opacity=".7"/>
    <circle cx="390" cy="40" r="1.1" opacity=".45"/><circle cx="660" cy="320" r="1.1" opacity=".45"/>
  </g>
  <g stroke="#fff" stroke-width="1.1" opacity=".5">
    <path d="M718 52 L718 68 M710 60 L726 60"/>
    <path d="M110 518 L110 530 M104 524 L116 524"/>
  </g>

  <!-- planeta -->
  <g>
    <circle cx="645" cy="625" r="92" fill="url(#planet)"/>
    <ellipse cx="645" cy="625" rx="138" ry="26" fill="none" stroke="#f0c9a0" stroke-width="7" opacity=".55"
