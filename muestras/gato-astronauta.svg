    <circle cx="612" cy="598" r="15" fill="#000" opacity=".10"/>
    <circle cx="672" cy="652" r="10" fill="#000" opacity=".09"/>
  </g>

  <circle cx="400" cy="382" r="250" fill="url(#glow)"/>

  <!-- ===== GATO ASTRONAUTA ===== -->
  <g transform="translate(0,-40)">
    <!-- cola -->
    <path d="M292 612 C218 608 182 560 206 512 C222 480 262 476 278 502"
          fill="none" stroke="#c3cce0" stroke-width="30" stroke-linecap="round"/>
    <path d="M292 612 C218 608 182 560 206 512 C222 480 262 476 278 502"
