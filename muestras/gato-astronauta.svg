      <!-- rayas -->
      <path d="M372 272 L366 296 M400 266 L400 292 M428 272 L434 296"
            stroke="#e8825c" stroke-width="7" stroke-linecap="round"/>
      <!-- ojos -->
      <ellipse cx="364" cy="340" rx="19" ry="23" fill="#1d2a3a"/>
      <ellipse cx="436" cy="340" rx="19" ry="23" fill="#1d2a3a"/>
      <circle cx="370" cy="331" r="7" fill="#fff"/><circle cx="442" cy="331" r="7" fill="#fff"/>
      <circle cx="359" cy="349" r="3.4" fill="#fff" opacity=".8"/>
      <circle cx="431" cy="349" r="3.4" fill="#fff" opacity=".8"/>
      <!-- nariz y boca -->
      <path d="M392 372 L408 372 L400 382 Z" fill="#ff7f9e"/>
      <path d="M400 382 C400 394 386 396 380 388" fill="none" stroke="#9a5b45" stroke-width="4" stroke-linecap="round"/>
      <path d="M400 382 C400 394 414 396 420 388" fill="none" stroke="#9a5b45" stroke-width="4" stroke-linecap="round"/>
      <!-- bigotes -->
      <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".92">
        <path d="M330 366 L286 356"/><path d="M330 378 L288 380"/>
        <path d="M470 366 L514 356"/><path d="M470 378 L512 380"/>
      </g>
    </g>

    <!-- casco -->
    <circle cx="400" cy="340" r="146" fill="none" stroke="#dfe6f2" stroke-width="13"/>
    <circle cx="400" cy="340" r="146" fill="url(#glass)"/>
    <path d="M300 246 C330 212 372 196 412 198" fill="none" stroke="#fff" stroke-width="13"
