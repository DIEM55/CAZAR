    <!-- antena -->
    <path d="M512 244 L556 196" stroke="#cfd8e8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="560" cy="190" r="13" fill="#ff6b6b"/>
    <circle cx="560" cy="190" r="22" fill="#ff6b6b" opacity=".22"/>
  </g>
</svg>
