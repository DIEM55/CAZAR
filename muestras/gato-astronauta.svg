    <ellipse cx="340" cy="726" rx="30" ry="18" fill="#ff8b5e"/>
    <ellipse cx="460" cy="726" rx="30" ry="18" fill="#ff8b5e"/>

    <!-- panel de control -->
    <rect x="364" y="524" width="72" height="50" rx="10" fill="#2b3350"/>
    <circle cx="384" cy="542" r="7" fill="#5fe08a"/><circle cx="408" cy="542" r="7" fill="#ffd166"/>
    <circle cx="432" cy="542" r="7" fill="#ff6b6b"/>
    <rect x="376" y="556" width="48" height="6" rx="3" fill="#4a5578"/>

    <!-- bandera -->
    <rect x="300" y="492" width="34" height="22" rx="4" fill="#5aa9e6"/>
    <text x="317" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"
          fill="#fff" text-anchor="middle">AR</text>

    <!-- cuello del casco -->
    <ellipse cx="400" cy="432" rx="104" ry="26" fill="#cfd8e8"/>
    <ellipse cx="400" cy="426" rx="104" ry="24" fill="#f2f5fa"/>

    <!-- cabeza del gato -->
    <g>
      <path d="M318 318 L330 236 L392 282 Z" fill="#f7a072"/>
      <path d="M330 300 L337 262 L368 285 Z" fill="#ffd3c0"/>
      <path d="M482 318 L470 236 L408 282 Z" fill="#f7a072"/>
      <path d="M470 300 L463 262 L432 285 Z" fill="#ffd3c0"/>
      <ellipse cx="400" cy="342" rx="98" ry="86" fill="#ffb088"/>
      <path d="M302 340 C302 300 340 268 400 268 C460 268 498 300 498 340
