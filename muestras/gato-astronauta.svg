    <path d="M318 470 C360 486 440 486 482 470" fill="none" stroke="#aab6cf" stroke-width="4"/>
    <!-- brazos -->
    <path d="M316 486 C272 502 256 548 268 586" fill="none" stroke="#e6ebf5" stroke-width="40" stroke-linecap="round"/>
    <path d="M484 486 C528 502 544 548 532 586" fill="none" stroke="#e6ebf5" stroke-width="40" stroke-linecap="round"/>
    <circle cx="266" cy="596" r="25" fill="#ff8b5e"/><circle cx="534" cy="596" r="25" fill="#ff8b5e"/>
